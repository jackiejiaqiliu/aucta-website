<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUCTA local loading audit</title><style>body{font:16px/1.5 system-ui;margin:24px}iframe{width:1440px;height:1000px;border:1px solid #ddd}pre{white-space:pre-wrap}button{padding:8px 14px}</style></head><body><h1>Local loading audit</h1><p>This optional tool measures the local pages in your current browser. It does not change website content.</p><button id="run">Run checks</button><a id="download" hidden>Download results</a><pre id="status"></pre><div id="frame"></div><script>
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const run=async()=>{document.querySelector('#run').disabled=true;const inventory=await (await fetch('../audit/page-inventory.json')).json(),pages=[];for(const route of Object.keys(inventory)){document.querySelector('#status').textContent='Measuring '+route;const frame=document.createElement('iframe');frame.src='../'+(route==='/'?'index.html':route.slice(1)+'/index.html')+'?loading-audit='+Date.now();document.querySelector('#frame').append(frame);await new Promise(resolve=>{frame.onload=resolve;setTimeout(resolve,20000)});await pause(250);const win=frame.contentWindow,doc=frame.contentDocument,nav=win.performance.getEntriesByType('navigation')[0];pages.push({route,paints:win.performance.getEntriesByType('paint').map(p=>({name:p.name,startTime:p.startTime})),domInteractive:nav?.domInteractive,domContentLoaded:nav?.domContentLoadedEventEnd,load:nav?.loadEventEnd,images:[...doc.images].filter(img=>img.getBoundingClientRect().width>0).slice(0,8).map(img=>({source:img.currentSrc,complete:img.complete,naturalWidth:img.naturalWidth})),resources:win.performance.getEntriesByType('resource').map(r=>({name:r.name,duration:r.duration,transfer:r.transferSize,kind:r.initiatorType}))});const collector=new URLSearchParams(location.search).get('collector');if(collector&&new URL(collector).hostname==='127.0.0.1')navigator.sendBeacon(collector,JSON.stringify({name:'live-server-page-'+route.replaceAll('/','__'),page:pages[pages.length-1]}));frame.remove()}const result={name:'live-server-loading',origin:location.origin,pages,note:'Same-origin page navigation timing in this browser; cache and device conditions affect results.'};document.querySelector('#status').textContent=JSON.stringify(result,null,2);const link=document.querySelector('#download');link.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));link.download='loading-audit.json';link.hidden=false;const collector=new URLSearchParams(location.search).get('collector');if(collector&&new URL(collector).hostname==='127.0.0.1')navigator.sendBeacon(collector,JSON.stringify({...result,pages:pages.map(({resources,images,...page})=>page)}));document.querySelector('#run').disabled=false};document.querySelector('#run').addEventListener('click',run);/* Checks only run on an explicit button click, including after Live Server reloads. */
</script></body></html>
